services:
  postgres:
    image: postgres:16-alpine
    container_name: deadlock-pro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deadlock_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - deadlock_pro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deadlock_pro"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: deadlock-pro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - deadlock_pro_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  deadlock_pro_postgres_data:
  deadlock_pro_redis_data:
